name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/...

  build:
    name: Build release assets
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip
          - goos: windows
            goarch: arm64
            ext: '.exe'
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p package dist
          go build \
            -ldflags "-s -w -X github.com/luciano-repetti/system-general-ai/internal/cli.version=${VERSION}" \
            -o "package/system-general-ai${{ matrix.ext }}" \
            ./cmd/system-general-ai

      - name: Package with Python
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python - <<'PY'
          import os, tarfile, zipfile
          version = os.environ["VERSION"]
          goos = os.environ["GOOS"]
          goarch = os.environ["GOARCH"]
          archive = os.environ["ARCHIVE"]
          base = f"system-general-ai_{version}_{goos}_{goarch}"
          exe = "system-general-ai.exe" if goos == "windows" else "system-general-ai"
          src = f"package/{exe}"
          if archive == "zip":
              with zipfile.ZipFile(f"dist/{base}.zip", "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(src, exe)
          else:
              with tarfile.open(f"dist/{base}.tar.gz", "w:gz") as t:
                  t.add(src, exe)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: system-general-ai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: dist/*
          generate_release_notes: true
